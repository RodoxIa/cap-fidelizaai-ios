# ============================================================================
# codemagic.yaml — FidelizaAI (wrapper Capacitor iOS)
# Build + assinatura + envio pro TestFlight/App Store via Codemagic (Mac na nuvem).
# Mesmo padrao do MeGuia (cap-meguia-ios). Free tier: mac_mini_m2, 500 min/mes.
# ----------------------------------------------------------------------------
#
# >>> PRE-REQUISITO QUE BLOQUEIA O UPLOAD <<<
#   O app PRECISA existir no App Store Connect (ter um Apple ID numerico) ANTES
#   de o build conseguir SUBIR (TestFlight/loja). Criar o app no ASC:
#       Plataforma iOS | Nome: FidelizaAI | Bundle ID: br.com.futurizeia.fidelizaai
#       SKU: fidelizaai-ios-001 | Idioma primario: PT-BR
#   (O Bundle ID ja esta registrado em Certificates, IDs & Profiles > Identifiers.)
#   Depois de criado, anotar o APPLE ID numerico e preencher APP_STORE_APPLE_ID abaixo.
#
# >>> ASSINATURA: AUTOMATIC via integracao App Store Connect <<<
#   Reusa a MESMA integracao do MeGuia ("meguia_asc": API Key .p8, Key ID Z4XV6T6BN6,
#   Issuer aed0a88a-...). Mesmo Team (9R57QQ98N6). Com `app-store-connect fetch-signing-files`
#   + `--create`, a Codemagic gera/baixa o CERT de distribuicao e o PROVISIONING PROFILE
#   App Store especificos de br.com.futurizeia.fidelizaai automaticamente, usando a API Key.
#   NAO precisa gerar/subir .p12 nem .mobileprovision por app. ZERO segredo no repo.
#
#   (Se a integracao no Codemagic tiver outro nome, trocar `meguia_asc` abaixo.)
#
# >>> EVITAR FALHA DE UPLOAD ANTES DO APP EXISTIR <<<
#   A publicacao so dispara em build da branch `main`. Enquanto o app nao existir
#   no ASC, rode o build em branch de teste (ex: `test-build`) -> COMPILA o .ipa
#   mas NAO tenta subir.
#
#  ATENCAO: o FidelizaAI usa CAMERA (leitura de QR no app). O Info.plist ja inclui
#  NSCameraUsageDescription. Sem essa chave a Apple rejeita / a camera nao abre.
# ============================================================================

workflows:
  ios-testflight:
    name: FidelizaAI iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: meguia_asc

    environment:
      vars:
        BUNDLE_ID: "br.com.futurizeia.fidelizaai"
        APP_STORE_APPLE_ID: 6785683107   # FidelizaAi (App Store Connect)
        APPLE_TEAM_ID: "9R57QQ98N6"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Instalar dependencias do wrapper (npm)
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Assinatura automatica (cert + profile App Store via ASC API Key)
        script: |
          set -e
          keychain initialize
          # Gera private key local (ver explicacao no codemagic.yaml do CarStatus):
          # sem ela, fetch-signing-files de cert existente da "Cannot save Signing
          # Certificates without certificate private key".
          PK="$CM_BUILD_DIR/cert_key.pem"
          openssl genrsa -out "$PK" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$PK" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # so TestFlight por enquanto
