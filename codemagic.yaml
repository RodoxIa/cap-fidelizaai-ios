# ============================================================================
# codemagic.yaml — FidelizaAI (wrapper Capacitor iOS)
# Build + assinatura + envio pro TestFlight via Codemagic (Mac na nuvem).
# Mesmo padrao do MeGuia (cap-meguia-ios). Free tier: mac_mini_m2, 500 min/mes.
# ----------------------------------------------------------------------------
#
# >>> O QUE O CHEFE PRECISA CONFIGURAR ANTES DE RODAR (conta Apple + Codemagic) <<<
#
#  1) Criar o app no App Store Connect:
#       - Plataforma iOS | Nome: FidelizaAI | Bundle ID: br.com.futurizeia.fidelizaai
#       - SKU: fidelizaai-ios-001 | Idioma primario: PT-BR
#       - Anotar o APPLE ID numerico do app e preencher em APP_STORE_APPLE_ID abaixo.
#
#  2) Integracao App Store Connect na Codemagic:
#       - Reusar a MESMA API Key .p8 do MeGuia (Key ID Z4XV6T6BN6, Issuer aed0a88a-...).
#         Mesmo Team (Futurize FuturizeIA, 9R57QQ98N6). Manter o nome "meguia_asc"
#         abaixo se reusar a integracao, ou criar "fidelizaai_asc".
#
#  3) ASSINATURA (grupo de secure vars `fidelizaai_signing`):
#       - cert+perfil App Store fixos para br.com.futurizeia.fidelizaai via secure vars:
#           CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE
#       - ou automatic code signing gerenciado pela Codemagic via API key.
#
#  4) NADA de segredo entra neste repositorio.
#
#  ATENCAO: o FidelizaAI usa CAMERA (leitura de QR no app). O Info.plist ja inclui
#  NSCameraUsageDescription. Sem essa chave a Apple rejeita / a camera nao abre.
# ============================================================================

workflows:
  ios-testflight:
    name: FidelizaAI iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: meguia_asc

    environment:
      groups:
        - fidelizaai_signing
      vars:
        BUNDLE_ID: "br.com.futurizeia.fidelizaai"
        APP_STORE_APPLE_ID: 0000000000   # <- PREENCHER com o Apple ID numerico do app (App Store Connect)
        APPLE_TEAM_ID: "9R57QQ98N6"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias do wrapper (npm)
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Setup assinatura (certificado + perfil fixos via secure vars)
        script: |
          set -e
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/fidelizaai_dist.p12
          keychain add-certificates \
            --certificate /tmp/fidelizaai_dist.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/fidelizaai_appstore.mobileprovision"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false  # so TestFlight por enquanto
